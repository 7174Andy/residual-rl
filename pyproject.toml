[project]
name = "two-wheel-exp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9.1",
    "gymnasium>=1.3.0",
    "imageio>=2.37.3",
    "imageio-ffmpeg>=0.6.0",
    "mediapy>=1.2.7",
    "mujoco>=3.11.0",
    "numpy>=2.4.6",
    "pygame>=2.6.1",
    "robot-descriptions>=3.1.0",
    "stable-baselines3>=2.9.0",
    "tensorboard>=2.21.0",
    "torch>=2.12.0",
    "wandb>=0.28.2",
]

[dependency-groups]
dev = [
    "matplotlib>=3.11.0",
    "mike>=2.2.0",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.4",
    "pymdown-extensions>=10.21.3",
    "pytest>=9.0.3",
]

[tool.pytest.ini_options]
markers = [
    "integration: tests that load real data files from data/",
]
