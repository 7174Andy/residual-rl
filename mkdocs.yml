site_name: two-wheeled-experiment
site_description: Two-wheel kinematic-unicycle goal-reaching env, DeePC controller, and the decision log behind both.
site_url: https://7174andy.github.io/two-wheeled-experiment/
repo_url: https://github.com/7174Andy/two-wheeled-experiment
repo_name: 7174Andy/two-wheeled-experiment
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["."]
          options:
            show_source: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            docstring_style: google
            docstring_section_style: table

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  version:
    provider: mike
    default: prod

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Guide:
      - Getting started: getting-started.md
  - Reference:
      - reference/index.md
      - Environment:
          - environment/index.md
          - Dynamics & spaces: environment/dynamics.md
          - Reward & episode: environment/reward.md
          - DeePC interface: environment/deepc-interface.md
          - API: environment/api.md
      - Controllers:
          - controllers/index.md
          - DeePC: controllers/deepc.md
          - Library switching: controllers/library-switching.md
          - Data collection: controllers/data-collection.md
          - API: controllers/api.md
      - CLI: reference/cli.md
  - Journey:
      - journey/index.md
      - 01. Task framing: journey/01-task-framing.md
      - 02. Env design: journey/02-env-design.md
      - 03. Action bounds: journey/03-action-bounds.md
      - 04. DeePC formulation: journey/04-deepc-formulation.md
      - 05. Cold-start bug: journey/05-cold-start.md
      - 06. Single library fails: journey/06-single-library-fails.md
      - 07. Library switching: journey/07-library-switching.md
      - 08. Stopping at the goal: journey/08-stop-at-goal.md
