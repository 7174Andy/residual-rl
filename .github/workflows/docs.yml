name: two-wheel-exp Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
      - 'two_wheel_robot/**/*.py'
  workflow_dispatch:
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'

permissions:
  contents: write

# Avoid concurrent pushes to gh-pages.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        # Docs deps live in [dependency-groups].dev (PEP 735).
        run: uv sync --all-groups

      - name: Print environment info
        run: |
          uv run python --version
          uv pip list

      - name: Configure Git for deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy documentation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        # --force overwrites gh-pages, wiping the old mike layout (prod/,
        # versions.json) so the site serves from the root.
        run: uv run mkdocs gh-deploy --force

      - name: Build documentation (manual / PR)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
        run: uv run mkdocs build --strict
